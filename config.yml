# Enable Update Messages: habilita los mensajes de actualización
enable-update-messages: true

# Para usar colores hexadecimales: &#hex
# PvP Messages: envía un mensaje al asesino y a la víctima cuando un jugador mata a otro.
# Marcadores de posición (placeholders) para mensajes PvP: %victim%, %victim-nick%, %killer%, %killer-nick%, %killer-x%, %killer-y%, %killer-z%, %victim-x%, %victim-y%, %victim-z%
enable-pvp-messages: true
killer-message: '&7[&c☠&7] &eTú mataste a &c%victim%'
victim-message: '&7[&c☠&7] &eFuiste asesinado por &c%killer%'

# Lightning: efecto de rayo en la ubicación de la muerte.
enable-lightning: true

# Porcentaje de caída de cabeza: probabilidad de soltar una cabeza, debe ser un número entre 0 y 1. (0 = 0%, 0.5 = 50%, 1 = 100%)
# Nombre de la cabeza: nombre que tendrá la cabeza cuando se suelte.
drop-head-percentage: 0.5
head-name: '&cCabeza de %victim%'

# Enfriamiento de mensajes: tiempo en segundos entre mensajes de muerte para un jugador específico. 0 para desactivar.
message-cooldown: 0

# Habilitar mensajes globales: muestra los mensajes de muerte a todo el servidor.
enable-global-messages: true

# Original al pasar el cursor: muestra el mensaje original de muerte de Minecraft al pasar el cursor.
enable-original-on-hover: false

# Mostrar ítem al pasar el cursor: muestra el ítem usado para matar al jugador al pasar el cursor.
enable-item-on-hover: true

# Puedes agregar, editar o eliminar cualquiera de los mensajes a continuación.
# Marcadores de posición para mensajes PvP: %kill-weapon%, %victim%, %victim-nick%, %killer%, %killer-nick%, %killer-x%, %killer-y%, %killer-z%, %victim-x%, %victim-y%, %victim-z%
global-pvp-death-messages:
- '&7[&c☠&7] &c%victim% &efue brutalmente asesinado por &c%killer%'
- '&7[&c☠&7] &c%victim% &efue abatido sin piedad por &c%killer% &eusando &7[&b%kill-weapon%&7]'
- '&7[&c☠&7] &c%victim% &efue completamente eliminado por &c%killer%'
- '&7[&c☠&7] &c%victim% &efue masacrado por &c%killer% &eusando &7[&b%kill-weapon%&7]'
- '&7[&c☠&7] &c%killer% &edestruyó sin piedad a &c%victim% &eusando &7[&b%kill-weapon%&7]'
- '&7[&c☠&7] &c%victim% &efue totalmente destruido por &c%killer%'
- '&7[&c☠&7] &c%killer% &ehumilló por completo a &c%victim%'
- '&7[&c☠&7] &c%victim% &efue aniquilado fácilmente por &c%killer% &eusando &7[&b%kill-weapon%&7]'

# Marcadores de posición para mensajes cuerpo a cuerpo: %victim%, %victim-nick%, %killer%, %killer-nick%, %killer-x%, %killer-y%, %killer-z%, %victim-x%, %victim-y%, %victim-z%
melee-death-messages:
- '&7[&c☠&7] &c%victim% &efue abofeteado por &c%killer%'
- '&7[&c☠&7] &c%victim% &efue noqueado por &c%killer%'
